name: WP Auto Poster

on:
  # 每天 UTC 0:00 = 北京时间 8:00
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发测试
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 允许 workflow commit state.json 并 push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto post script
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_USER_PWD: ${{ secrets.WP_USER_PWD }}
          SF_USER_TOKEN: ${{ secrets.SF_USER_TOKEN }}
          POST_STATUS: ${{ secrets.POST_STATUS || 'publish' }}
        run: python auto_post.py

      - name: Commit state.json
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json not found, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged, skip commit"
          else
            git commit -m "chore: update state.json [skip ci]"
            git push
            echo "✅ state.json pushed to main"
          fi